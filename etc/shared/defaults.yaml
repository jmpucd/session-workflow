# Cross-machine defaults. Sourced by every digi command.
# A machine needs NO config of its own: every key below is the default for
# every Mac. Only differences go in an optional etc/machines/<name>.yaml
# (e.g. an edit mini pointing paths.local_working at its TB SSD) — see
# etc/machines/README.md.

# Filesystem paths. What a machine can do depends only on these being set:
# capture_root -> digi park/presync; local_working -> checkout/checkin.
paths:
  capture_root: "~/Pictures/capture_sessions"
  local_working: "~/Pictures/capture_sessions"
  av_root: ""
  scratch: "/tmp/digi"

# Where the Synology share mounts, and the parked-session queue on it.
mounts:
  synology: "/Volumes/Digitization_Files"
  campus_server: ""

sessions:
  synology_root: "/Volumes/Digitization_Files/capture_sessions"

synology:
  # Share that 'digi mount' (and its launchd agent) keeps mounted. Mounts at
  # each machine's mounts.synology path; a machine can override the URL with
  # mounts.synology_url in its own yaml.
  smb_url: "smb://JohnPike@DigiLab483._smb._tcp.local/Digitization_Files"
  # Fallback when the lab LAN name doesn't resolve (off campus): the same share
  # over Tailscale. Connect once in Finder to this URL with "Remember this
  # password" checked so the keychain has an entry for it too.
  smb_url_tailscale: "smb://JohnPike@100.82.239.38/Digitization_Files"
  # park/checkin/checkout/force-unlock refuse to write when the share has
  # less than this much free (plus the session size, for park). A full share
  # silently writes 0-byte files over SMB.
  min_free_gb: 50

rsync:
  # Flags applied to every rsync invocation across the toolkit.
  # -a   archive (perms, times, symlinks, recursive)
  # -h   human-readable sizes
  # -P   progress + partial (resumable)
  # --info=stats2,progress2  cleaner progress reporting
  flags: "-ahP --info=stats2,progress2"

  # Patterns we never copy. Capture One previews + macOS metadata cruft +
  # Adobe Bridge cache files (some students review captures in Bridge).
  excludes:
    - ".DS_Store"
    - "._*"
    - ".Spotlight-V100"
    - ".Trashes"
    - ".fseventsd"
    - "Cache/"
    - "Proxies/"
    - ".BridgeSort"
    - ".BridgeCache"
    - "*.bc"
    - "*.bct"

ffmpeg:
  # Default H.264 settings for course-video delivery (compromise: quality vs size).
  course_video:
    vcodec: "libx264"
    crf: 20
    preset: "slow"
    acodec: "aac"
    abitrate: "192k"
    pix_fmt: "yuv420p"
    extra: "-movflags +faststart"
