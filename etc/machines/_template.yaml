# Per-machine config for digi.
# Copy of this template is created automatically by install.sh as
# etc/machines/<hostname>.yaml. Edit values to match this machine.

# What this machine is *primarily* used for. One of:
#   capture | edit | laptop | nas | server
# This is a label only — nothing in digi actually checks it. What a
# machine can do is entirely determined by which paths below are filled
# in: set capture_root and digi park works here; set local_working and
# digi checkout/checkin work here. A machine can have both filled in at
# once if that's genuinely how it's used (e.g. a capture station that
# also does its own edits locally, or an edit machine that occasionally
# captures) — there's no exclusive category to pick between.
role: edit

# Filesystem paths used by digi commands. Leave blank if not applicable
# — but "not applicable" is about how this machine is actually used, not
# about its role label above. Fill in whichever of these actually apply,
# independently of each other.
paths:
  # Where Capture One captures land locally on this machine. Set this
  # wherever captures actually happen — typically the capture station,
  # but nothing stops another machine from having this set too.
  capture_root: ""

  # Where sessions live while being worked on locally (cropping/QA). Set
  # this wherever checkout/checkin should work — a capture station that
  # also edits locally can set this to the same path as capture_root; an
  # editing mini should point it at the fast TB-attached SSD, e.g.
  # /Volumes/Edit_SSD/capture_sessions.
  local_working: ""

  # Where AV digitization output lands locally.
  av_root: ""

  # Local scratch / working dir (fast SSD if possible).
  scratch: "/tmp/digi"

# Mount points / network shares this machine sees.
mounts:
  synology: ""        # e.g. /Volumes/digitization
  campus_server: ""   # e.g. /Volumes/centos-backup or via SSH (see remotes)

# Capture One session workflow (park / checkout / checkin).
sessions:
  # Canonical home for parked sessions on the Synology share.
  # e.g. /Volumes/digitization/capture_sessions
  synology_root: ""

# SSH targets for remote operations.
remotes:
  campus:
    host: ""          # e.g. centos.lib.ucdavis.edu
    user: ""
    backup_root: ""   # remote path for backups
    delivery_root: "" # remote path for Special Collections delivery

  synology:
    host: ""
    user: ""

# Anything else specific to this machine.
notes: ""
